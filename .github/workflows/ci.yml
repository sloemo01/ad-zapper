name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Manifest parses
        run: node -e 'JSON.parse(require("fs").readFileSync("manifest.json","utf8")); console.log("manifest ok")'

      - name: Rule sets parse
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync("rules").filter(f => f.endsWith(".json"));
            for (const f of files) JSON.parse(fs.readFileSync("rules/" + f, "utf8"));
            console.log(files.length + " rule sets parse");
          '

      # Every suite runs even when an earlier one fails, so one red suite does
      # not hide the state of the other thirteen. The step fails at the end.
      - name: Test suites
        run: |
          : > "$RUNNER_TEMP/suites.txt"
          fail=0
          for f in test/*.test.js; do
            name=$(basename "$f")
            echo "::group::$name"
            if node "$f"; then
              echo "ok    $name" >> "$RUNNER_TEMP/suites.txt"
            else
              echo "FAIL  $name" >> "$RUNNER_TEMP/suites.txt"
              fail=1
            fi
            echo "::endgroup::"
          done
          cat "$RUNNER_TEMP/suites.txt"
          exit $fail

      # The installers are the first thing a stranger runs, so a broken one has
      # to fail here rather than on their machine.
      - name: Installer scripts
        run: |
          bash -n install/install-macos.sh
          bash install/install-macos.sh --dry-run
          AD_ZAPPER_DIR="$RUNNER_TEMP/az" bash install/install-macos.sh --download-only
          test -f "$RUNNER_TEMP/az/manifest.json"
          test "$(ls "$RUNNER_TEMP/az"/rules/*.json | wc -l)" -ge 10
          pwsh -NoProfile -File install/parse-check.ps1

      - name: Smoke
        if: always()
        run: |
          if node test/smoke.js; then
            echo "ok    smoke" >> "$RUNNER_TEMP/suites.txt"
          else
            echo "FAIL  smoke" >> "$RUNNER_TEMP/suites.txt"
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "### Suites" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/suites.txt" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "ran: $(wc -l < "$RUNNER_TEMP/suites.txt" | tr -d ' ')  failed: $(grep -c '^FAIL' "$RUNNER_TEMP/suites.txt" || true)"
          test "$(grep -c '^FAIL' "$RUNNER_TEMP/suites.txt" || true)" = "0"
